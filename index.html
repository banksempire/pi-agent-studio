<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- iPhone: the notch/status-bar zone takes its color from these. Safari
       tints its toolbar from theme-color; in standalone (added to home
       screen) black-translucent makes the status bar transparent with
       white glyphs, so the page's own background — pure black — shows in
       the notch. -->
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>pi-agent-studio</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/pi-studio/main.ts"></script>
</body>
</html>
